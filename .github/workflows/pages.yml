name: Deploy HackRU demo to GitHub Pages

on:
  push:
    branches: ["draft-1"]
    paths:
      - "web/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test analysis and build browser engine
        run: npm run check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload web demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
